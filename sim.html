<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SURVIVE — Simulation</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <link rel="stylesheet" href="style.css">

  <script>
  // Read scene IMMEDIATELY before anything loads
  var SCENE_TYPE = new URLSearchParams(
    window.location.search
  ).get('scene') || 'flood';

  var SCENE_COLORS = {
    flood:  { sky:'#0a1628', ground:'#1B5E20', water:'#0D47A1', fog:'#0a1628' },
    fire:   { sky:'#3d0000', ground:'#4a1500', water:'#FF6D00', fog:'#3d0000' },
    quake:  { sky:'#1a1200', ground:'#3e2000', water:'#5D4037', fog:'#1a1200' },
    victim: { sky:'#0a1628', ground:'#1B5E20', water:'#0D47A1', fog:'#0a1628' }
  };

  var C = SCENE_COLORS[SCENE_TYPE] || SCENE_COLORS.flood;
  </script>
</head>
<body>

<!-- HUD -->
<div id="hud">
  <div id="hud-title">🌊 SURVIVE</div>
  <div id="timer">90</div>
  <div id="score-display">Score: 0</div>
</div>

<!-- STRESS BAR -->
<div id="stress-bar"><div id="stress-fill"></div></div>

<!-- MESSAGE -->
<div id="message"></div>

<!-- RESULT -->
<div id="result">
  <div id="result-grade">🏆</div>
  <div id="result-title">SURVIVOR</div>
  <div id="result-score">Score: 0</div>
  <div id="result-feedback">Great decisions.</div>
  <a href="sim.html" class="result-btn btn-retry">🔁 Try Again</a>
  <a href="map.html" class="result-btn btn-map">🗺 Map</a>
  <a href="index.html" class="result-btn btn-map">🏠 Home</a>
</div>

<!-- 3D SCENE -->
<a-scene
  id="main-scene"
  renderer="antialias:true"
  loading-screen="backgroundColor:#05051a; dotsColor:#2196F3">

  <!-- SKY — color set by JS below -->
 <a-sky id="main-sky" 
  color="#0a1628"
  animation__sky="property:material.color;
    type:color;
    from:#0a1628;
    to:#0a1628;
    dur:1">
</a-sky>

  <!-- GROUND -->
  <a-plane id="main-ground"
    position="0 0 0" rotation="-90 0 0"
    width="100" height="100"
    color="#1B5E20">
  </a-plane>

  <!-- PATH TO SAFE -->
  <a-plane position="-4 0.01 -6"
    rotation="-90 0 -20"
    width="1.5" height="12"
    color="#8D6E63" opacity="0.8">
  </a-plane>

  <!-- PATH TO SHELTER -->
  <a-plane position="0 0.01 -10"
    rotation="-90 0 0"
    width="1.5" height="12"
    color="#8D6E63" opacity="0.8">
  </a-plane>

  <!-- FLOOD WATER -->
  <a-box id="flood-water"
    position="0 -4 0"
    width="100" height="3" depth="100"
    color="#0D47A1" opacity="0.75"
    animation="property:position; to:0 3 0;
               dur:90000; easing:linear">
  </a-box>

  <!-- WATER SHIMMER -->
  <a-plane id="water-shimmer"
    position="0 -0.9 0" rotation="-90 0 0"
    width="100" height="100"
    color="#1565C0" opacity="0.3"
    animation="property:position; to:0 2.1 0;
               dur:90000; easing:linear">
  </a-plane>

  <!-- ═══ SAFE ZONE ═══ -->
  <a-entity id="safe-zone" position="-8 0 -14">
    <!-- Building -->
    <a-box width="6" height="6" depth="6"
      color="#2E7D32"
      animation__hover="property:scale;
        startEvents:mouseenter; to:1.03 1.03 1.03; dur:200"
      animation__leave="property:scale;
        startEvents:mouseleave; to:1 1 1; dur:200">
    </a-box>
    <!-- Roof -->
    <a-cone position="0 4.5 0"
      radius-bottom="4" height="3"
      color="#1B5E20">
    </a-cone>
    <!-- Window left -->
    <a-plane position="1.5 1 3.01"
      width="1" height="1.2"
      color="#90CAF9" opacity="0.9"
      material="emissive:#64B5F6; emissiveIntensity:0.6">
    </a-plane>
    <!-- Window right -->
    <a-plane position="-1.5 1 3.01"
      width="1" height="1.2"
      color="#90CAF9" opacity="0.9"
      material="emissive:#64B5F6; emissiveIntensity:0.6">
    </a-plane>
    <!-- Door -->
    <a-plane position="0 -1 3.01"
      width="1.2" height="2"
      color="#4E342E">
    </a-plane>
    <!-- Glow rings -->
    <a-torus position="0 0.1 0"
      radius="5" radius-tubular="0.08"
      color="#66BB6A" opacity="0.5"
      animation="property:rotation; to:0 360 0;
                 dur:8000; loop:true; easing:linear">
    </a-torus>
    <a-torus position="0 0.1 0"
      radius="4" radius-tubular="0.05"
      color="#A5D6A7" opacity="0.3"
      animation="property:rotation; to:0 -360 0;
                 dur:5000; loop:true; easing:linear">
    </a-torus>
    <!-- Floating label -->
    <a-plane position="0 6.5 0"
      width="5.5" height="1.2"
      color="#1B5E20" opacity="0.95"
      animation="property:position;
        from:0 6.2 0; to:0 6.8 0;
        dir:alternate; dur:2000; loop:true">
      <a-text value="✓ SAFE ZONE +100"
        align="center" color="white"
        width="10" position="0 0 0.01">
      </a-text>
    </a-plane>
    <!-- Particles -->
    <a-sphere position="2 4 2" radius="0.15"
      color="#66BB6A" opacity="0.8"
      animation="property:position;
        from:2 4 2; to:2 7 2;
        dur:2000; loop:true; dir:alternate">
    </a-sphere>
    <a-sphere position="-2 3 1" radius="0.12"
      color="#A5D6A7" opacity="0.7"
      animation="property:position;
        from:-2 3 1; to:-2 6 1;
        dur:2500; loop:true; dir:alternate">
    </a-sphere>
  </a-entity>

  <!-- ═══ DANGER ZONE ═══ -->
  <a-entity id="danger-zone" position="8 0 -14">
    <!-- Bridge -->
    <a-box width="5" height="0.5" depth="7"
      color="#B71C1C">
    </a-box>
    <!-- Rails -->
    <a-box position="-2.5 1 0"
      width="0.2" height="2" depth="7"
      color="#C62828">
    </a-box>
    <a-box position="2.5 1 0"
      width="0.2" height="2" depth="7"
      color="#C62828">
    </a-box>
    <!-- Broken section -->
    <a-box position="0.5 -0.8 -1"
      width="2" height="0.5" depth="3"
      color="#7f0000" rotation="15 0 10">
    </a-box>
    <!-- Warning ring -->
    <a-torus position="0 0.1 0"
      radius="5" radius-tubular="0.08"
      color="#EF5350" opacity="0.5"
      animation="property:rotation; to:0 -360 0;
                 dur:4000; loop:true; easing:linear">
    </a-torus>
    <!-- Label -->
    <a-plane position="0 3 3.5"
      width="5" height="1.2"
      color="#B71C1C" opacity="0.95"
      animation="property:position;
        from:0 2.8 3.5; to:0 3.3 3.5;
        dir:alternate; dur:2000; loop:true">
      <a-text value="⚠ DANGER -50pts"
        align="center" color="#FF5252"
        width="9" position="0 0 0.01">
      </a-text>
    </a-plane>
    <!-- Particles -->
    <a-sphere position="1 2 1" radius="0.15"
      color="#FF5252" opacity="0.8"
      animation="property:position;
        from:1 2 1; to:1 5 1;
        dur:1500; loop:true; dir:alternate">
    </a-sphere>
    <a-sphere position="-1 1.5 -1" radius="0.12"
      color="#FF1744" opacity="0.7"
      animation="property:position;
        from:-1 1.5 -1; to:-1 4.5 -1;
        dur:1800; loop:true; dir:alternate">
    </a-sphere>
  </a-entity>

  <!-- ═══ SHELTER ZONE ═══ -->
  <a-entity id="shelter-zone" position="0 0 -20">
    <!-- Tower -->
    <a-cylinder radius="3" height="5"
      color="#E65100"
      material="roughness:0.6; metalness:0.3">
    </a-cylinder>
    <!-- Dome -->
    <a-sphere position="0 3.5 0" radius="3.2"
      color="#F57F17"
      phi-start="0" phi-length="180"
      material="roughness:0.5; metalness:0.4">
    </a-sphere>
    <!-- Inner glow -->
    <a-sphere position="0 2 0" radius="1"
      color="#FFD54F" opacity="0.4"
      material="emissive:#FFD54F; emissiveIntensity:0.8">
    </a-sphere>
    <!-- Gold ring -->
    <a-torus position="0 0.1 0"
      radius="6" radius-tubular="0.1"
      color="#FFD54F" opacity="0.5"
      animation="property:rotation; to:0 360 0;
                 dur:6000; loop:true; easing:linear">
    </a-torus>
    <!-- Label -->
    <a-plane position="0 7.5 0"
      width="6" height="1.2"
      color="#E65100" opacity="0.95"
      animation="property:position;
        from:0 7.2 0; to:0 7.8 0;
        dir:alternate; dur:2000; loop:true">
      <a-text value="⊕ SHELTER +150pts"
        align="center" color="#FFD54F"
        width="11" position="0 0 0.01">
      </a-text>
    </a-plane>
    <!-- Particles -->
    <a-sphere position="2 5 2" radius="0.2"
      color="#FFD54F" opacity="0.9"
      material="emissive:#FFD54F; emissiveIntensity:0.5"
      animation="property:position;
        from:2 5 2; to:2 8 2;
        dur:2200; loop:true; dir:alternate">
    </a-sphere>
    <a-sphere position="-2 4 -2" radius="0.15"
      color="#FFCA28" opacity="0.8"
      animation="property:position;
        from:-2 4 -2; to:-2 7 -2;
        dur:1800; loop:true; dir:alternate">
    </a-sphere>
  </a-entity>

  <!-- ═══ SECRET ROOFTOP ═══ -->
  <a-entity id="roof-zone" position="-8 6 -14">
    <a-box width="5.8" height="0.4" depth="5.8"
      color="#6A1B9A"
      material="emissive:#4A148C; emissiveIntensity:0.4">
    </a-box>
    <a-torus position="0 0.2 0"
      radius="4" radius-tubular="0.06"
      color="#CE93D8" opacity="0.7"
      animation="property:rotation; to:0 360 0;
                 dur:4000; loop:true; easing:linear">
    </a-torus>
    <a-plane position="0 1.8 0"
      width="5" height="1.1"
      color="#4A148C" opacity="0.95"
      animation="property:position;
        from:0 1.5 0; to:0 2.2 0;
        dir:alternate; dur:1500; loop:true">
      <a-text value="★ SECRET +200pts"
        align="center" color="#CE93D8"
        width="9" position="0 0 0.01">
      </a-text>
    </a-plane>
  </a-entity>

  <!-- ═══ TREES ═══ -->
  <a-entity position="-18 0 -10">
    <a-cylinder radius="0.4" height="6" color="#3E2723"></a-cylinder>
    <a-cone position="0 5 0" radius-bottom="3" height="5" color="#1B5E20"></a-cone>
    <a-cone position="0 7 0" radius-bottom="2" height="4" color="#2E7D32"></a-cone>
  </a-entity>
  <a-entity position="-22 0 -18">
    <a-cylinder radius="0.3" height="7" color="#4E342E"></a-cylinder>
    <a-cone position="0 6 0" radius-bottom="2.5" height="5" color="#388E3C"></a-cone>
  </a-entity>
  <a-entity position="-15 0 -22">
    <a-cylinder radius="0.5" height="5" color="#3E2723"></a-cylinder>
    <a-cone position="0 4 0" radius-bottom="3.5" height="6" color="#1B5E20"></a-cone>
  </a-entity>
  <a-entity position="18 0 -10">
    <a-cylinder radius="0.4" height="6" color="#3E2723"></a-cylinder>
    <a-cone position="0 5 0" radius-bottom="3" height="5" color="#2E7D32"></a-cone>
    <a-cone position="0 7 0" radius-bottom="2" height="4" color="#388E3C"></a-cone>
  </a-entity>
  <a-entity position="22 0 -18">
    <a-cylinder radius="0.3" height="8" color="#4E342E"></a-cylinder>
    <a-cone position="0 7 0" radius-bottom="2.5" height="5" color="#1B5E20"></a-cone>
  </a-entity>
  <a-entity position="15 0 -24">
    <a-cylinder radius="0.5" height="5" color="#3E2723"></a-cylinder>
    <a-cone position="0 4 0" radius-bottom="3.5" height="6" color="#2E7D32"></a-cone>
  </a-entity>

  <!-- ═══ MOUNTAINS ═══ -->
  <a-cone position="-30 0 -50"
    radius-bottom="20" height="25"
    color="#1a2a3a" opacity="0.8">
  </a-cone>
  <a-cone position="30 0 -50"
    radius-bottom="18" height="22"
    color="#1a2a3a" opacity="0.8">
  </a-cone>
  <a-cone position="0 0 -60"
    radius-bottom="22" height="28"
    color="#162030" opacity="0.9">
  </a-cone>

  <!-- ═══ MOON ═══ -->
  <a-sphere position="-20 18 -50" radius="2"
    color="#ECEFF1" opacity="0.9"
    material="emissive:#ECEFF1; emissiveIntensity:0.3">
  </a-sphere>

  <!-- ═══ STARS ═══ -->
  <a-sphere position="20 15 -30" radius="0.08" color="white" opacity="0.9"></a-sphere>
  <a-sphere position="-25 18 -35" radius="0.06" color="white" opacity="0.7"></a-sphere>
  <a-sphere position="15 20 -40" radius="0.1" color="white" opacity="0.8"></a-sphere>
  <a-sphere position="-18 12 -25" radius="0.07" color="#90CAF9" opacity="0.9"></a-sphere>
  <a-sphere position="30 22 -45" radius="0.09" color="white" opacity="0.6"></a-sphere>
  <a-sphere position="-30 25 -50" radius="0.08" color="#BBDEFB" opacity="0.7"></a-sphere>
  <a-sphere position="5 18 -38" radius="0.06" color="white" opacity="0.8"></a-sphere>
  <a-sphere position="-10 22 -42" radius="0.1" color="white" opacity="0.5"></a-sphere>
  <a-sphere position="25 16 -28" radius="0.07" color="#90CAF9" opacity="0.9"></a-sphere>

  <!-- ═══ CLOUDS ═══ -->
  <a-entity position="-10 12 -30">
    <a-sphere radius="2" color="#1a3a5a" opacity="0.5"></a-sphere>
    <a-sphere position="2 0.5 0" radius="2.5" color="#1a3a5a" opacity="0.4"></a-sphere>
    <a-sphere position="-2 0.3 0" radius="1.8" color="#1a3a5a" opacity="0.4"></a-sphere>
  </a-entity>
  <a-entity position="12 14 -35">
    <a-sphere radius="2.5" color="#1a3a5a" opacity="0.4"></a-sphere>
    <a-sphere position="2.5 0.5 0" radius="2" color="#1a3a5a" opacity="0.35"></a-sphere>
  </a-entity>

  <!-- ═══ LIGHTS ═══ -->
  <a-light id="lightning"
    type="ambient" color="#BBDEFB" intensity="0.4">
  </a-light>
  <a-light type="directional"
    color="#90CAF9" intensity="0.6"
    position="-5 15 5">
  </a-light>
  <a-light type="point"
    color="#1565C0" intensity="0.8"
    position="0 5 -10">
  </a-light>

  <!-- ═══ CAMERA ═══ -->
  <a-camera id="camera"
    position="0 1.6 4"
    wasd-controls="acceleration:15"
    look-controls="reverseMouseDrag:false">
    <a-cursor
      fuse="true" fuse-timeout="1500"
      color="white" opacity="0.9"
      geometry="primitive:ring;
                radiusInner:0.01;
                radiusOuter:0.016"
      material="color:white; shader:flat"
      animation__fusing="property:scale;
        startEvents:fusing;
        from:1 1 1; to:0.2 0.2 0.2; dur:1500"
      animation__click="property:scale;
        startEvents:click;
        from:0.2 0.2 0.2; to:1 1 1; dur:150">
    </a-cursor>
  </a-camera>

</a-scene>

<!-- Apply scene colors AFTER A-Frame loads -->
<script>
document.querySelector('a-scene')
  .addEventListener('loaded', function() {

  var sky    = document.getElementById('main-sky');
  var ground = document.getElementById('main-ground');
  var water  = document.getElementById('flood-water');
  var shimmer= document.getElementById('water-shimmer');
  var C      = SCENE_COLORS[SCENE_TYPE];

  function forceSky() {
    sky.setAttribute('color', C.sky);
    if (sky.components && sky.components.material) {
      sky.components.material.material.color.set(C.sky);
    }
  }

  ground.setAttribute('color', C.ground);
  water.setAttribute('color',  C.water);

  document.querySelector('a-scene').setAttribute('fog',
    'type:exponential; color:'+C.fog+'; density:0.018'
  );

  // Force sky 5 times
  forceSky();
  setTimeout(forceSky, 500);
  setTimeout(forceSky, 1000);
  setTimeout(forceSky, 2000);
  setTimeout(forceSky, 4000);
});
</script>

<script src="sim.js"></script>
</body>
</html>
